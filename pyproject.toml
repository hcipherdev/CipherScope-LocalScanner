[project]
name = "cipherscope-local"
version = "0.1.0"
description = "Local PQC migration priority scanner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "jinja2>=3.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cipherscope-local = "CipherScope_local.scanner.cli:main"

[tool.setuptools.packages.find]
include = ["CipherScope_local*"]

[tool.pytest.ini_options]
testpaths = ["CipherScope_local"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
